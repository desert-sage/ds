  # A fifth part, and it is a spec tree like the other four: proto/** is inside
  # specs/ ([STYL.2.14.1]) and its field layouts are normative ([STYL.2.14.2]).
  # Listing them is what gives each message an anchor, so an English clause can
  # cite `proto/alfa.proto#AlphaNode` and have it resolve ([STYL.2.14.3/.4]).
  # Pages are generated by scripts/spec/spec_book.py from proto/*.proto; a file added
  # to proto/ without a line here still renders but is not cross-linkable, and
  # spec_book warns.
  - caption: Wire Format (protobuf)
    chapters:
      - file: proto/alfa
      - file: proto/atom
      - file: proto/beta
      - file: proto/bounds_error
      - file: proto/builtin_fn
