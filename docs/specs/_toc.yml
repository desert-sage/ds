  - caption: Reference Runtime Specification
    chapters:
      - file: runtime/README
      - file: runtime/ARCHITECTURE
      - file: runtime/CONFORMANCE_TESTS
      # A document retired entire loses its directory (owner ruling), so it has
      # no page and no line here: CONNECTIONS, DEBUG_PROTOCOL, DS_PROTOCOL,
      # PORTABLE_IR, and impl/COMPILER below. A line naming a document with no
      # directory is a dangling toctree entry, which breaks the render and is
      # caught by no gate.
      - file: runtime/DIALECT_BINDING
      - file: runtime/COMPILER_CLI
      - file: runtime/DSC_FORMAT
      - file: runtime/FACT_STREAM
      - file: runtime/HYDRATION_IMPLEMENTATION
      - file: runtime/LOWERING
      - file: runtime/REALTIME_CONTRACT
      - file: runtime/TESTING_IMPLEMENTATION

  - caption: Implementation
    chapters:
