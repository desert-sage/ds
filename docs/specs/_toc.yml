# Table of contents — DS Specifications (one book, four parts).
# Navigation only; does not alter any document's content. Each part is a spec
# tree; keeping them in one book is what makes inter-spec cross-links resolve.
format: jb-book
root: README

parts:
  - caption: Language Specification
    chapters:
      - file: language/README
      - file: language/SCOPE
      - file: language/DETERMINISM
