#
# SOURCE PINS — dependencies whose FILES a DS build compiles itself, pinned at
# a commit and checked file by file: CORE-MATH and musl's libm, which libds
# compiles, and SoftFloat and TestFloat, which the double-backend check of
# [NDET.1.4] compiles beside a row's libds.
#
# CORE-MATH'S FILES ARE COMMITTED under vendor/core-math/; no build fetches them.
# This section is their provenance (the commit, each file's digest, the flags),
# and `url` is where a refresh is taken from. gitlab.inria.fr refuses
# some automated GETs with a bot-proxy page, so a build-time fetch failed at
# random; do not reintroduce one.
#
# WHY NOT deps.lock. deps.lock's rows are packages: a release tarball, one
# digest, a cmake or autotools build that installs a prefix into the store.
# CORE-MATH has no release, no tarball and no build libds can use — libds takes
# fifteen of its functions as C files and compiles them with its own pinned
# flags. And deps.lock is in the build context of the ds-deps and ds-check
# images, so every edit to it rebuilds both.
# [IARC.7.10] asks for the pin and its flags together, "in deps.lock or beside
# it"; this file is beside it.
#
# WHY FILE DIGESTS AND NOT AN ARCHIVE DIGEST. GitLab synthesises a commit's
# archive on demand and does not promise its bytes — the same reason deps.lock
# refuses GitHub's /archive/ URLs. A file's bytes at a commit are the blob, and
# the blob does not move. So the pin is the commit, and the check is every file
# we use, each against its sha256. A file the list does not name is not fetched,
# and a file whose digest differs fails the build.
#
# The files stay unmodified: CORE-MATH is vendored unpatched, the `exit(1)`
# branches in pow and atan2 included.

# ── CORE-MATH ───────────────────────────────────────────────────────────────
#
# The commit the eligibility probe measured, so the archive ships the code the evidence is about.
#
# `files` is the set the fifteen builtins of [LEXP.3.9.1] and `**` need: each
# function's one `.c`, the local headers those include (`dint.h`, `tint.h`,
# `pow.h`, `qint.h`), and the license. Nothing else is compiled: the `.wc`
# worst-case tables, the MPFR references and the generators (`buildSC.c`,
# `buildu.c`, `log1_template.g`) are upstream's test and build material.
#
# `cflags` are part of the function ([IARC.7.10]): `-ffp-contract=off` because
# a fused multiply-add rounds once where the code expects twice, `-std=gnu11`
# because the 128-bit integer type needs it, and `-O2` because that is what the
# probe measured. FLT_EVAL_METHOD must be 0, which excludes x87; the build
# checks it rather than this file stating it. libds adds only flags that do
# not change a result: -fPIC, -g, a lane's instrumentation, and
# `-include core_math_fenv.h`, which defines the C11 7.6 exception macros a
# soft-float target leaves undefined (the header says why no result reads one).
#
# `corroborated`: the probe's copies of two unmodified files under
# dev/probes/core-math-u128/ have the same git blob ids as this commit's.
[core-math]
