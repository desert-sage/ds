# ── SoftFloat and TestFloat ([NDET.1.4]) ─────────────────────────────────────
#
# WHAT THEY ARE FOR. [NDET.1.4] admits a row's double arithmetic only once it
# has been shown correct against the archive the row ships, and part 1 of
# "shown" is Berkeley TestFloat, level 2, round to nearest even, against its own
# SoftFloat reference. This binds the hosted 1.0.0 rows. Neither tree reaches libds.a or anything a release ships:
# the check compiles them into upstream's testfloat_gen and testfloat_ver, and
# pipes the one into the other through DS's own subject (the operations as
# libds compiles them, linked against the row's libds.a).
#
# John Hauser's releases are 3e (SoftFloat) and 3e (TestFloat); upstream's git
# is ucb-bar's, with no release tags, so each is pinned at the commit its
# default branch carried on 2026-10-27, and fetched as raw blobs, which do not
# move, as CORE-MATH's are.
#
# `files` is what those two programs compile and nothing else, derived from
# their links, and never hand-picked: f64, f32 (which
# the generator and verifier always carry) and the integer conversions, and no
# f16, bf16, extF80 or f128 code. SoftFloat's specialisation is 8086-SSE, the one its
# Linux-x86_64-GCC build takes. It decides NaN payloads and invalid integer
# results, and the check checks neither (TestFloat's defaults, `-checkNaNs` and
# `-checkInvInts` off), so it fixes no verdict on another row. Upstream's
# in-process `testfloat`, its `subj-C` subject and each build directory's
# `platform.h` are not taken: DS supplies its own subject and `platform.h`.
#
# `cflags` are the upstream Makefiles' for each tree: SoftFloat's
# Linux-x86_64-GCC options, and TestFloat's with only FLOAT64 enabled.
#
# Committed under vendor/softfloat/ and vendor/testfloat/, unmodified, as
# CORE-MATH's and musl's are; DIGESTS repeats the digests.
#
# `corroborated`: each file was taken twice. Once from a clone at the commit,
# where the set and its digests were derived, and once as raw blobs, each
# checked against these digests (2026-10-27).
