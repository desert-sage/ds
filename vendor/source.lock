# ── musl's libm ([IARC.7.11], [IARC.7.14]) ──────────────────────────────────
#
# WHO COMPILES WHAT. Every libds build compiles `src/math/fma.c` and
# `src/math/scalbn.c` (libds.build's Libm rows, and the Mercury trees' copies in
# mercury.build and release.build): [IARC.7.14] makes libds's `fma` its own on
# every row, and musl's `fma` calls `scalbn`. `fmin.c`, `fmax.c` and
# `round.c` are kept for the microcontroller rows, which are post-v1 and have
# no build yet: the rest of what their C library would otherwise decide. One
# section, not two: all five files are one upstream commit, and two pins of one
# commit are a second copy to drift.
#
# musl's `fma` is correctly rounded. picolibc's and
# newlib's generic `fma` is `x*y + z`, two roundings.
#
# Like CORE-MATH's, the files are COMMITTED, under vendor/musl/: no
# build fetches them, and this section is their provenance and the refresh
# source. `{path}` because musl's cgit takes the commit
# as a query. The files are unmodified; runtime/src/libds/mcu_libm/ supplies
# the two headers of musl's internal tree they include (`atomic.h` for
# `fma.c`, `libm.h` for `round.c`) with exactly what they use. `fma` and
# `scalbn` are renamed `ds_libm_<fn>` at compile time on every row;
# runtime/src/libds/mcu_libm/mcu_libm.redefine-syms holds the private names of
# all five.
#
# `cflags`: `-ffp-contract=off` so a software fma is not compiled into the
# fused operation it replaces, and `-fno-builtin` so the compiler lowers none
# of these functions' own calls to a builtin the C library would supply.
#
# `corroborated`: the git blob id of each file served, against the same paths
# in a clone of git.musl-libc.org/git/musl at the commit (2026-10-08).
[musl]
