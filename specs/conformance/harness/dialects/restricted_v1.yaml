#
# A harness dialect: the conformance corpus names it, and the language does
# not ([LDIA.6.1.4] commits three names, [LDIA.9]). The harness registers it
# as an integrator registers its own ([NDLC.2.1]).
#
# Every construct capability off except `logical` and `float`, so the
# fixtures that name it reach DS_VALIDATE_CAPABILITY_DISABLED for `call`,
# `publish`, `cache`, `regex` and `series`. The storage and samples-plane
# capabilities are off as every dialect's are ([LCAP.2.10]).
name: restricted_v1
settings:
  realtime: false
  constspace: false
  linear_scan: true
  logical: true
  dynamic_ttl: false
  regex: false
  float: true
  call: false
  publish: false
  cache: false
  cache_delete: false
  nocooldown: false
  series: false
  sampled_slots: false
  persist_on_series: false
  storage_hydrate_facts: false
  storage_hydrate_samples: false
