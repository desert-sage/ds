syntax = "proto3";

package ds.v1;

// FactPublish — atom body. A rule's `publish` ran ([RFCS.27]). It holds no slot
// value and no fact handle: the fact is in no working memory ([LTIE.4.3]).
//
// STREAM-CLASS: compare ([RFCS.3.4]).
message FactPublish {
  string schema_name = 1;  // name of the DS schema
  string rule_name   = 2;  // the publishing rule; never "" on this atom
  uint64 clock_ns    = 3;  // engine clock at the publish (ns)
  uint64 seq         = 4;  // stream sequence number
  uint64 timetag     = 5;  // the firing's timetag ([RFCS.11.2])
}
