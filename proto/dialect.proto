syntax = "proto3";

package ds.v1;

// DialectInfo atom body. Per [RDSC.15].
message DialectInfo {
  // Name of the dialect the program's `use` directive named ([RDSC.15.3]).
  // Informational; binding compares resolved settings, never this name.
  string name = 1;
}
