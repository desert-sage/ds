syntax = "proto3";

package ds.v1;

// FactRetract — atom body. The integrator retracting a fact it
// asserted ([RFCS.7.1]); the engine's counterpart is FactWithdraw.
//
// `clock_ns` and `seq` are the stream event's, as on every other event atom
// ([RFCS.7.5]).
message FactRetract {
  uint64 fact_id  = 1;  // matches FactAssert.fact_id of the fact to retract
  uint64 seq      = 2;  // stream sequence number of the retraction
  uint64 clock_ns = 3;  // engine clock at the retraction (ns)
}
