syntax = "proto3";

package ds.v1;

// Hydration atom body. Per [RDSC.5.6]. Presence marks the named
// (schema, slot) as hydration-eligible; absence leaves it
// ineligible.
message Hydration {
  string schema_name = 1;
  string slot_name   = 2;
  uint32 module_id   = 10;
}
