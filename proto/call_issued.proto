syntax = "proto3";

package ds.v1;

import "fact_external.proto";  // Arg

// CallIssued — the one `CallIssued` event body ([LFST.6.3]), carried by the
// recorded fact stream as the CallIssued atom (registry 262, [RFCS.15]).
// Multiple calls may be outstanding simultaneously.
//
// The recorder is its one producer. Field 1 is vestigial: nothing assigns it,
// and an allocated number is never reused ([STYL.2.8.7]).
message CallIssued {
  uint64 call_id     = 1;  // vestigial: nothing assigns it
  string service     = 2;  // "domain.method"
  string correlation = 3;  // the call's `as`, or the per-activation value the
                           // compiler generated for a call with none
                           // ([LCRS.3.1], [LCCO.3.4]); never empty
                           // ([RFCS.15.2])
  uint64 clock_ns    = 5;  // engine clock at issue (ns)
  uint64 seq         = 6;  // engine stream event sequence number
  // Recording provenance ([RFCS.15]).
  string rule_name   = 7;  // firing rule; with timetag, the activation identity
  int64  timetag     = 8;  // firing activation's creation timetag — the CallIssued↔RuleFireAnnotation
                           // join key (RuleFireAnnotation must record the same identity)
  // The call's arguments, one per kwarg the call supplies, sorted by name;
  // an omitted optional kwarg is absent ([RFCS.15.2]).
  repeated Arg args  = 9;

  reserved 4;
  reserved "body_json";
}
