syntax = "proto3";

package ds.v1;

// SchemaSource atom body. Per [RDSC.5.7].
//
// `module_id` attributes the schema to its declaring module. Display
// path resolves to DsSource[module_id].file at view time.
message SchemaSource {
  string schema_name = 1;
  reserved             2;
  uint32 line        = 3;
  uint32 col         = 4;
  uint32 module_id   = 10;
}
