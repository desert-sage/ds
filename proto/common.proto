syntax = "proto3";

package ds.v1;

// Compression codec for atom bodies that carry bulk text or
// bytes (DsSource, SchemaDef). COMPRESSION_NONE is the only supported
// codec ([RDSC.4.4], [RDSC.4.5]).
enum Compression {
  COMPRESSION_UNSPECIFIED = 0;
  COMPRESSION_NONE        = 1;
  reserved 2;  // never reused
}
