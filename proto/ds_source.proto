syntax = "proto3";

package ds.v1;

import "common.proto";

// DsSource atom body. Per [RDSC.14.2].
//
// `module_id` joins this DsSource to its module's per-module metadata
// atoms. The `file` field stays as the human-readable display path
// (used by tooling to render the source location) but the runtime
// joins atoms by module_id, not by file string.
message DsSource {
  string      file        = 1;
  Compression compression = 2;
  bytes       data        = 3;
  uint32      module_id   = 10;
}
