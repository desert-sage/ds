syntax = "proto3";

package ds.v1;

import "series_backend_ring_buffer.proto";  // SeriesNullPolicy

// SeriesBackendIntervalPulse atom body. Per [RDSC.5a] / [LSIG.2.2]. Interval-pulse deque backing
// for `active_fraction` — the time-weighted fraction of a sliding window
// during which a Bool slot held `true`. Element type is always Bool, so no
// element_type field is carried.
//
// Load-bearing (LSIG.2.6): a runtime that does not recognise this atom must
// HARD-REJECT the .dsc, never skip — the backing IS the aggregation's
// storage and algorithm. Registered in [RDSC.7.1].
message SeriesBackendIntervalPulse {
  string schema_name        = 1;
  string slot_name          = 2;
  // "" for `by: none` per LSER.7.6.2.
  string identity_slot_name = 3;
  // Required (> 0): active_fraction is sliding only (LSIG.1.3.3).
  uint64 window_ns          = 5;
  // 0 = live-only; non-zero forwards samples to the samples plane.
  uint64 persist_ns         = 6;
  // Transition capacity under realtime: true (.dsrt); 0 = unbounded (default).
  uint32 max_samples        = 7;
  uint32 module_id          = 10;
  SeriesNullPolicy null_policy = 11;  // [LNUL.8.6]
}
