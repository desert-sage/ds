syntax = "proto3";

package ds.v1;

// The log level, the single definition ([STYL.5.9.7]). It is the number in
// `FN_LOG`'s level operand (RLOW.7.7.1), `OracleLog.severity`, and libds's
// `ds_log_level_t`, which mirrors it member for member and value for value.
//
// 0-based with no UNSPECIFIED member: every site that carries a level carries
// one of these five, so zero is DEBUG.
enum LogSeverity {
  LOG_SEVERITY_DEBUG    = 0;
  LOG_SEVERITY_INFO     = 1;
  LOG_SEVERITY_WARNING  = 2;
  LOG_SEVERITY_ERROR    = 3;
  LOG_SEVERITY_CRITICAL = 4;
}
