syntax = "proto3";

package ds.v1;

import "common.proto";

// SchemaDef atom body. Per [RDSC.5.8] and [LFAC.8.3]. Carries
// the canonical .proto definition the compiler generated
// from the schema's DS declaration; this is the cross-
// boundary serialisation shape for instances of the schema.
message SchemaDef {
  string      schema_name  = 1;
  Compression compression  = 2;
  bytes       proto_source = 3;
  uint32      module_id    = 10;
}
