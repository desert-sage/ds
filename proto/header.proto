syntax = "proto3";

package ds.v1;

import "capabilities.proto";

// DscHeader atom body. Per [RDSC.3].
message DscHeader {
  // [LDET.1.10]: DS carries no format version of its own: an artefact records the DS version that wrote it and nothing else, and a
  // runtime accepts its own `<major>.<minor>.` series and rejects every other.
  // Numbers and names never reused ([STYL.2.8.7]).
  reserved 1, 2;
  reserved "format_major", "format_minor";
  // [LDET.1.10] — THE version an artefact carries, and the one the loader's
  // acceptance test reads.
  string compiler_version   = 3;
  reserved 4, 5;
  reserved "source_path", "build_timestamp_ns";
  reserved 6;
  reserved "exec_ir";
  // Dialect-binding tuple (per RBND.1.3 / RDSC.3.6+).
  bytes           dsc_sha256         = 7;   // 32 raw bytes
  reserved 8, 9;
  reserved "dialect_tier", "dialect_extensions";
  repeated Capability capabilities   = 13;  // enabled settings, ascending ([RBND.1.3])
  bytes           dialect_def_sha256 = 10;  // 32 raw bytes
  // RT-config binding (per RBND.1.4 / RTCT.6 / RDSC.3.8).
  // 32 raw bytes when realtime: true; empty when not.
  bytes           rt_config_sha256   = 11;
  // The Unicode pin is implied by the compiler version alone ([LNAM.2.2.5]): advancing it is a
  // minor-release change, which [LDET.1.10] already keeps apart.
  reserved 12;
  reserved "unicode_version";
  // The program's fault-fact site count, compiler-derived; the fault-fact pool
  // under realtime or constspace is sized from it (RDSC.3.10, [LERR.9.10]).
  uint32          fault_fact_sites   = 14;
}
