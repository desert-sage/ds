#
# test_compile_dialects.py's own dialect: `default`'s settings ([LDIA.9.2])
# under a name the language does not define, so a program naming it compiles
# only when `pyds.compile(dialect_files=...)` registered the file first
# ([NDLC.2.1]). It is not the harness's: the conformance corpus never names it.
name: plain
settings:
  realtime: false
  constspace: false
  linear_scan: true
  logical: true
  dynamic_ttl: false
  regex: true
  float: true
  call: true
  publish: true
  cache: true
  cache_delete: true
  nocooldown: true
  series: true
  sampled_slots: false
  persist_on_series: false
  storage_hydrate_facts: false
  storage_hydrate_samples: false
