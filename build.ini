# build.ini — the fleet's build-unit deployment config (the default ./build.ini
# build-unit reads; found via $BUILD_INI, then ./build.ini, then next to the buildfile).
#
# It carries the fleet's wiring — ssh host aliases by role, their
# capabilities, and repo roots — so the deployment is version-controlled instead
# of hand-edited per checkout on the coordinator. Someone standing up their own
# fleet starts from this file and points the aliases at their own hosts.
#
# Coordinator: a coordinator container on build-coordinator (ssh material from
# ~/build-coord). It reaches build-arm64-linux (the arm64 build host, which ALSO
# runs the microctl esp32 toolchain service), build-amd64-linux,
# build-rv64gc-linux and build-amd64-netbsd over ssh. The host names are ssh
# aliases, defined in the coordinator's ssh config. Device firmware
# (firmware/microctl.build) places `require: "microctl"` steps on
# build-arm64-linux via the `microctl` cap below; the release places steps by
# arch/toolchain caps. The tools, repo and docker sections use absolute tool
# paths and git sync.

[tools]
ssh    = /usr/bin/ssh
scp    = /usr/bin/scp
docker = /usr/bin/docker

[docker]
# `-v /ds-cache:/ds-cache` (VENDOR1). One host directory, mounted into every
# session container, holding what is expensive to rebuild and keyed so it cannot
# be reused wrongly: `libds` archives (LIBDSSTORE1) and the vendored dependency
# prefixes.
#
# WITHOUT IT THE VENDORED STORE CANNOT WORK AT ALL, and the failure is silent
# rather than loud. `scripts/vendor/vendor.py` falls back to `vendor-out/` in the tree when
# no store is mounted — a deliberate degradation, since a laptop has no
# /ds-cache — but the tree is what `[repo] sync` runs `git clean -qfdx` over, so
# every run would rebuild Abseil, RE2 and protobuf from source and discard them.
# That looks like a slow build rather than a missing mount.
run-opts = --rm -v /ds-cache:/ds-cache
# EVERY STEP CONTAINER RUNS AS THE SSH USER, the user
# who owns the checkout it works in, so nothing it writes is anyone else's.
# build-unit gives it `--user $(id -u):$(id -g)` read on its host and
# HOME=/ds/.build/home, and after every step fails it if anything in the slot
# is owned by another user, naming the paths: a regression stops at the step
# that introduced it. There is no chown fallback: a fallback would hide exactly
# the regression the guard exists to catch.
#
# /ds-cache is the ssh user's on every host.
run-as   = ssh-user

[repo]
rev  = git -C {root} rev-parse HEAD
sync = git -C {root} fetch --quiet origin {ref} && git -C {root} reset --quiet --hard {ref} && git -C {root} clean -qfdx

[hosts]
# EVERY ROOT IS ON THE HOST'S OWN DISK, never under /home/cicd, which is NFS on the
# Linux build hosts by design. A root holds the synced checkout and,
# beside it, `<root>.runs/`, the per-run clones every placed step works in. On NFS
# each run's `git clone --no-hardlinks` and `reset --hard` cost minutes before a
# step started.
#
# `/ds-build` is the ssh user's on every Linux host, as /ds-cache is: a directory
# on the root disk, or on build-rv64gc-linux a bind of
# /var/lib/docker-iscsi/ds-build. The checkout is a clone of the repository at
# `/ds-build/ds`, and `[repo] sync` keeps it at the run's ref.
build-arm64-linux  = /ds-build/ds
# The NetBSD builder (BSDREL1 B4, amd64), a real host that takes the ordinary
# `[repo] sync` like every other target and needs no per-host override. Its home
# is on its own disk, and its rebuild procedure (runtime/vm/systemate/lib/dsvm/
# netbsd_rebuild.dot) makes the checkout there.
build-amd64-netbsd = /home/cicd/dev/ds-build
# build-amd64-linux is the coordinator host itself, reached over ssh like any other
# target. It needs a row because `localhost` means something different depending
# on where build-unit runs: run directly on the docker host it IS that host, but run
# from the coordinator container (which is how the release driver works) it is the
# CONTAINER, which has no docker CLI. Naming the host explicitly makes placement
# independent of where build-unit happens to be running.
build-amd64-linux  = /ds-build/ds
# build-rv64gc-linux (riscv64, RV64NATIVE1).
build-rv64gc-linux = /ds-build/ds

[slots]
# How many steps each host runs at once, each in a slot tree of its own beside
# its root (ds-lang/build-unit#77). Per ssh alias, so every `alias|image` row
# draws from its host's count; a host not named here runs one step at a time.
# `release_coord.py` runs build-unit as wide as the kept hosts' counts summed.
build-amd64-linux  = 6
build-arm64-linux  = 4
build-rv64gc-linux = 1
build-amd64-netbsd = 1

[caps]
# Each target's COMPLETE, honest capability set. build-arm64-linux carries the
# `microctl` tag (it runs the esp32 toolchain service + has the boards attached),
# so firmware/microctl.build's `require: "microctl"` steps land there — the ONLY
# firmware-specific change over the release config.
# Image rows name the STABLE alias (ds-<name>:latest), never a content sha.
# The sha tag is the pinned identity, the alias follows the current build. A sha would rot on the next Dockerfile edit
# (RELFLEET1).
# NO COMPILER TOKEN ON A LINUX BARE HOST. DS compiles
# in a CONTAINER on every linux target. `build-amd64-netbsd` is the one row that
# compiles natively — NetBSD has no container — and it carries no COMPILER
# token, which is what the policy test actually checks.
#
# A bare `localhost` row with `gcc14.2` would satisfy release.build's
# `libds-linux-glibc-amd64` (`amd64 linux gcc14.2`), so the amd64 glibc tarball,
# a SHIPPED artifact, could be built by whatever gcc is installed on the docker
# host. It resolves to `build-amd64-linux|ds-build:latest` instead, the image
# whose gcc is pinned and probed.
#
# `docker` stays: that is this host's actual role, and it is what makes the
# container rows below reachable at all.
localhost                            = amd64 linux docker
build-arm64-linux                     = arm64 linux docker microctl
# build-arm64-linux is the ONLY arm64 build host, so every
# arm64 row queues on it. A second arm64 host is a row here with exactly these
# tokens and the `|image` rows below, and never `microctl`: the esp32 toolchain
# service and the boards are build-arm64-linux's, and `require: "microctl"` is
# how firmware finds them.
# NetBSD ON THE METAL. `netbsd` names the machine itself, and the
# shipped tarball is netbsd-amd64. NetBSD proves the
# OS port; `linux-glibc-arm64` and `linux-glibc-rv64gc` carry the architecture
# proof.
#
# NO COMPILER TOKEN, deliberately.
# The steps that land here `require netbsd`, and that token is carried by exactly
# one row.
build-amd64-netbsd                    = amd64 netbsd
# ds-build is base + wheel/setuptools + jupyter-book, so ONE image carries both
# the wheel and docs caps (its own header: "docs-build maps here, not a 4th
# image"). It is py3.12 via ds-python, and ds_docs.build's `require` matches it.
build-arm64-linux|ds-build:latest     = arm64 linux gcc14.2 py3.12 wheel docs
# `docs` is on this one target. Docs rendering is arch-independent, so one docs
# host costs nothing. Each render hands its book on as one declared archive
# (ds_docs.build), so the renders, the pack and the link gate need share no
# tree, and a second target with the cap would be a cap edit alone.
# `emscripten3.1.74` is a TOOLCHAIN token on an amd64 linux host, exactly as
# `musl` is — it does not name the target. `require` describes what the builder
# needs; the vendor LINEAGE names what it emits (`wasm`). That split is why wasm
# having no architecture never reaches placement.resolve, which load-balances on
# sha256(step) % len(eligible) and only ever asks about the host.
#
# ON ITS OWN IMAGE: the wasm rows run the same DS
# tooling every other row runs, on ds-python's 3.12, and emscripten's own image
# is Ubuntu 22.04 at Python 3.10. So `ds-emsdk` is ds-python + emsdk — the toolchain comes to the supported image without riding in
# ds-build.
#
# emsdk publishes no riscv64 toolchain, and ds-build is the image behind the
# glibc libds tarball, the pyds wheel and the docs site, so keeping emsdk out of
# it lets ds-build build for riscv64 (RV64NATIVE1). A host that cannot have
# emsdk simply has no ds-emsdk row, and placement keeps the wasm rows off it.
build-amd64-linux|ds-build:latest     = amd64 linux gcc14.2 py3.12 wheel
build-amd64-linux|ds-emsdk:latest     = amd64 linux py3.12 emscripten3.1.74
# musl — release.build requires 'linux musl' for two of the five libds tarballs.
# ds-musl is an Alpine outlier (no ds-base), and being content-addressed off one
# Dockerfile it carries the same tag on every arch — each host builds its own.
build-arm64-linux|ds-musl:latest      = arm64 linux musl
build-arm64-linux|ds-musl-test:latest = arm64 linux musl musltest
build-amd64-linux|ds-musl:latest      = amd64 linux musl
# The musl BEHAVIOUR image (ds-musl-test), one row per musl builder. `musltest`
# is the token the per-row test steps require; it is NOT on the ds-musl rows
# above, so a test can never be placed in the build image — which lacks pytest,
# cmocka and a 3.14 interpreter and would fail two layers into the run.
build-amd64-linux|ds-musl-test:latest = amd64 linux musl musltest
# riscv64 on real hardware (RV64NATIVE1): build-rv64gc-linux runs the standard
# images natively.
#
# `riscv64` AND NOT `rv64gc`, DELIBERATELY, and the difference is the point of
# RV64ISA1. A cap token says what a MACHINE is — it is `uname -m`, the same
# thing Docker's platform says — while `rv64gc` says what an ARTIFACT was
# compiled for. The shipped names carry the second (`ds-libds-…-linux-musl-
# rv64gc.tar.gz`) because that is the promise an integrator links against; the
# rows here carry the first, because that is what placement is asking about.
build-rv64gc-linux                    = riscv64 linux docker
build-rv64gc-linux|ds-musl:latest     = riscv64 linux musl
build-rv64gc-linux|ds-musl-test:latest = riscv64 linux musl musltest
# The glibc row: ds-build builds on riscv64 like any other architecture.
build-rv64gc-linux|ds-build:latest    = riscv64 linux gcc14.2 py3.12 wheel
