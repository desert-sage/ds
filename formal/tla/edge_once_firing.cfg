\* TLC config for the [LTIM.2.5] once-per-match firing spec, in the clause's
\* engine: the firing is a flag on the activation, and the pump drains. Four
\* pumps let a condition open, shut and open again with a pump to spare; two
\* wrappers let a retract and a re-mint happen in one behaviour. SPECIFICATION
\* carries weak fairness on the firing and on the pump's end, so the liveness
\* is checked beside the safety. The engines the clauses rule out are the
\* three `.teeth.` configs.
CONSTANT ltim_2_4_2__MAXPUMP = 4
CONSTANT ltim_2_5_2__MAXWRAPPER = 2
CONSTANT ltim_2_5_1__READING = "match"
CONSTANT iret_11_5__LIMITED = FALSE
SPECIFICATION ltim_2_5__Spec
INVARIANT   ltim_2_5__TypeOK
INVARIANT   ltim_2_5_1__once_per_edge
PROPERTY    ltim_2_5_1__fired_where_it_rose
PROPERTY    ltim_2_4_1__shut_means_silent
PROPERTY    ltim_2_4_2__edge_fires
