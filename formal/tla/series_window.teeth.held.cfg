\* TEETH for [LSER.19.8], the cold read. A read is cold only before the first
\* absorption -- the step function's rule, which the clause gives
\* `active_fraction` and `integral` alone, applied to a windowed aggregation:
\* after a silence the read sees nothing and is not cold.
\* MUST VIOLATE: lser_19_8__cold_iff_empty
