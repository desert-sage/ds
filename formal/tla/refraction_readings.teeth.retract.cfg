\* TEETH, in an engine that gets a cell wrong: a retract leaves the activation
\* waiting, so a token that was retracted fires at the next drain. A stream
\* with a retract in it ends on a sequence that is not its cell of the table.
\* MUST VIOLATE: ldet_5_3__table_holds
CONSTANT ldet_5_3__ENGINE = "retract_keeps_pending"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_3__table_holds
