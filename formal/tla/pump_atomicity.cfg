\* TLC config for the [RARC.13.16] pump-atomicity spec: the fine-grained pump,
\* the integrator's callback trying a read and an assert between its steps, and
\* the integrator's asserts between pumps, against the atomic step. Four facts,
\* one chain (a fact f emits f + 1). No fairness: the checks are safety.
\* The engine is the clause's; the engines it rules out are the `.teeth.` configs.
CONSTANT rarc_13_16__ENGINE = "clause"
CONSTANT rarc_5_6_4__MAXF = 4
CONSTANT rarc_5_6_6__STEP = 1
SPECIFICATION rarc_13_16__Spec
INVARIANT   rarc_13_16__TypeOK
PROPERTY    rarc_13_16__pump_refines_step
