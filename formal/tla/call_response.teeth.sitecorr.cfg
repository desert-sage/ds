\* TEETH, in an engine the clause rules out: a call with no `as` takes one
\* correlation per call site instead of one per firing. Such a call fires, is
\* answered, and fires again: its firings share a correlation, so the second
\* sweeps the first's answer, where [LCCO.3.4] has one reply per call and
\* [LRST.1.2] has the call supersede nothing.
\* MUST VIOLATE: lrst_1_2__generated_supersedes_nothing
CONSTANT lcrs_3_3__call = { c1, c2 }
CONSTANT lcrs_4_3_2__TTL = 2
CONSTANT lcrs_4_2_1__ERROR_TTL = 3
CONSTANT lcrs_6_2_4__FIRES = 2
CONSTANT lcco_3_4__GENERATED = { c2 }
CONSTANT lcrs_8_1__COOLED = { c1 }
CONSTANT lcrs_8_2__WINDOW = 1
CONSTANT lcrs_8_2__DENIALS = 1
CONSTANT lcrs_6_1__ENGINE = "sitecorr"
SPECIFICATION lcrs_6_1__Spec
PROPERTY    lrst_1_2__generated_supersedes_nothing
