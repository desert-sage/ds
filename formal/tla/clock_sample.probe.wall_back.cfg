\* PROBE for [LTIM.2.8.3] and [LTIM.2.8.5], in the clause's engine: the constants
\* of clock_sample.cfg, unchanged. The wall clock is set back between two
\* steps, and the replay engine, driven by the atoms alone, holds the earlier
\* instant after the later one. A replay of a wall clock that goes back, seen
\* to happen.
\* MUST VIOLATE: probe__wall_never_goes_back
CONSTANT ltim_2_8_4__MAXSTEP = 3
CONSTANT ltim_2_8_4__MAXREAD = 2
CONSTANT ltim_2_8_2__MAXMONO = 2
CONSTANT ltim_2_8_3__MAXWALL = 1
CONSTANT ltim_2_8_4__SAMPLING = "step"
CONSTANT ltim_2_8_5__FIRST = "always"
CONSTANT ltim_2_8_5__WHAT = "both"
CONSTANT rfcs_10_5__ORDER = "before"
CONSTANT ltim_2_8_2__RELATIVE = "mono"
SPECIFICATION ltim_2_8_4__Spec
PROPERTY    probe__wall_never_goes_back
