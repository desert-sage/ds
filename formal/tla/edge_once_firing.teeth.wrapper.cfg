\* TEETH for [LTIM.2.5.1]. The engine that remembers a firing per wrapper,
\* past the end of the activation: a condition that opens, shuts and opens
\* again is two edges and one firing. It is [IRET.11.3.2] read as written --
\* a shut gate is not among the things that clear an identity -- and it is the
\* behaviour [LTIM.2.5.1] forbids.
\* MUST VIOLATE: ltim_2_5_1__once_per_edge
CONSTANT ltim_2_4_2__MAXPUMP = 4
CONSTANT ltim_2_5_2__MAXWRAPPER = 2
CONSTANT ltim_2_5_1__READING = "wrapper"
CONSTANT iret_11_5__LIMITED = FALSE
SPECIFICATION ltim_2_5__Spec
INVARIANT   ltim_2_5_1__once_per_edge
