\* TLC config for the [IRET.12] TMS retract-propagation cascade.
\* The SPECIFICATION carries weak fairness on the cascade, so TLC checks that the
\* cascade completes (liveness) as well as multi-justifier survival (safety),
\* and that at quiescence every live fact is well-founded: on this graph the
\* count IS the obligation.
\* The engine is the clause's and the graph is its ranked instance; the engine
\* it rules out is the `.teeth.lingers.` config, the graph [LCYC.3.1.1] rules
\* out is the `.teeth.cycle.` config.
CONSTANT iret_12__ENGINE = "clause"
CONSTANT iret_12__GRAPH = "ranked"
SPECIFICATION iret_12__Spec
INVARIANT   iret_12__TypeOK
INVARIANT   llog_2_5__well_founded_is_fixed
INVARIANT   iret_12_2__quiescent_is_well_founded
PROPERTY    iret_12_3__multi_justifier_survives
PROPERTY    iret_12_2__no_unsupported_forever
