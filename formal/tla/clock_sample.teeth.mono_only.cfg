\* TEETH for [LTIM.2.8.5], both clocks. An engine the clause rules out:
\* one clock observed and carried. No atom restores the wall clock, so the
\* replay's is where it started, and the first `now()` it reads is already not
\* the one that was read. A wall clock that later moves alone is on no atom
\* either; the first step is the shorter trace, and the one TLC returns.
\* MUST VIOLATE: ltim_2_8_5__replay_holds_what_was_held
CONSTANT ltim_2_8_4__MAXSTEP = 3
CONSTANT ltim_2_8_4__MAXREAD = 2
CONSTANT ltim_2_8_2__MAXMONO = 2
CONSTANT ltim_2_8_3__MAXWALL = 1
CONSTANT ltim_2_8_4__SAMPLING = "step"
CONSTANT ltim_2_8_5__FIRST = "always"
CONSTANT ltim_2_8_5__WHAT = "mono"
CONSTANT rfcs_10_5__ORDER = "before"
CONSTANT ltim_2_8_2__RELATIVE = "mono"
SPECIFICATION ltim_2_8_4__Spec
INVARIANT   ltim_2_8_5__replay_holds_what_was_held
