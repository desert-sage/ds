\* TLC config for the hydration-completion protocol spec ([LHYD.5] / [NCBK.9] / [RHIM.3]).
\* A LIVENESS model: the SPECIFICATION carries weak fairness on the gate, on each fact
\* assertion, and on completion, so TLC checks the hydration always resolves (liveness)
\* alongside complete-after-all (safety). The engine is the clause's; the engines
\* it rules out are the `.teeth.` configs.
CONSTANT rhim_5_1__BUDGET = 2
CONSTANT rhim_3_2__TARGET = 2
CONSTANT rhim_3__ENGINE = "clause"
SPECIFICATION rhim_3__Spec
INVARIANT   rhim_3__TypeOK
INVARIANT   rhim_3_4__complete_after_all
PROPERTY    lhyd_5__eventually_resolves
