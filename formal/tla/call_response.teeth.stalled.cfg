\* TEETH, in an engine the clause rules out: the clock never ticks. An answer
\* goes live and no deadline ever arrives, so it is live for ever. With no
\* tick and every call fired its FIRES times, nothing is enabled: that state
\* is the stall itself, not a deadlock to report, so deadlock checking is off
\* and TLC reaches the liveness violation.
\* MUST VIOLATE: lcrs_6_6_1__no_orphan_forever
CHECK_DEADLOCK FALSE
CONSTANT lcrs_3_3__call = { c1, c2 }
CONSTANT lcrs_4_3_2__TTL = 2
CONSTANT lcrs_4_2_1__ERROR_TTL = 3
CONSTANT lcrs_6_2_4__FIRES = 2
CONSTANT lcco_3_4__GENERATED = { c2 }
CONSTANT lcrs_8_1__COOLED = { c1 }
CONSTANT lcrs_8_2__WINDOW = 1
CONSTANT lcrs_8_2__DENIALS = 1
CONSTANT lcrs_6_1__ENGINE = "stalled"
SPECIFICATION lcrs_6_1__Spec
PROPERTY    lcrs_6_6_1__no_orphan_forever
