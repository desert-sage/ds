\* PROBE for [LSIG.2.2.4]: the clause's engine, against a property that says
\* no sample is ever exactly W old at a read. TLC must return the behaviour
\* that reaches the boundary, so that the half-open window is a case this
\* scope decides and not one it never meets.
\* MUST VIOLATE: probe__no_sample_is_exactly_W_old_at_a_read
CONSTANT lser_14_1__MODEL = "sliding"
CONSTANT lser_14_1__W = 2
CONSTANT lsmp_2_1__N = 2
CONSTANT ltim_2_8_2__MAXCLOCK = 5
CONSTANT lser_14_1__MAXABSORB = 3
CONSTANT lsig_2_2_4__LEFT = "open"
CONSTANT lsig_2_2_4__EDGE_LEFT = "open"
CONSTANT lsig_2_5_1__READ = "discounts"
CONSTANT lsig_2_5_1__EVICT = "window"
CONSTANT lsig_1_4_1__BEFORE = "nothing"
CONSTANT lser_19_8__COLD = "empty"
CONSTANT lsig_1_4_2__DENOM = "min"
SPECIFICATION lser_14_1__Spec
INVARIANT   probe__no_sample_is_exactly_W_old_at_a_read
