\* TLC config for the [RTCT.7.1] / [RTCT.7.2] RT cap-enforcement spec.
\* One representative counted cap over time, in the clause's engine (POISONS is
\* FALSE). SPECIFICATION carries weak fairness on retract so the not-poisoned
\* recovery liveness is checked alongside the within-cap, no-mutation-on-breach
\* and refused-only-over-the-cap safety. CAP >= 1 (CAP=0 has no room to ever
\* commit). The engine the clause rules out is the two `.teeth.` configs.
CONSTANT rtct_7_1__CAP = 2
CONSTANT rtct_7_2__POISONS = FALSE
SPECIFICATION rtct_7_1__Spec
INVARIANT   rtct_7_1__TypeOK
INVARIANT   rtct_7_1__within_cap
PROPERTY    rtct_7_2__breach_no_mutation
PROPERTY    rtct_7_2__refused_only_over_cap
PROPERTY    rtct_7_2__not_poisoned
