\* TRUE) no assert is enabled after the first breach, however much room is
\* freed: the property the old `result = "ok"` form could not tell from recovery.
\* MUST VIOLATE: rtct_7_2__not_poisoned
CONSTANT rtct_7_1__CAP = 2
CONSTANT rtct_7_2__POISONS = TRUE
SPECIFICATION rtct_7_1__Spec
