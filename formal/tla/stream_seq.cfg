\* TLC config for the [LFST.7.1] / [NCBK.2.2] event-stream seq-sequencing spec.
\* Sits above the per-firing formal/alloy/firing_event_frame.als. A SAFETY model:
\* invariants over every reachable source interleaving, no fairness needed.
\* The engine is the clause's; the engine it rules out is the `.teeth.` configs'.
CONSTANT lfst_7_1__Source = { s1, s2, s3 }
CONSTANT lfst_7_1__CAP = 2
CONSTANT lfst_7_1__ENGINE = "clause"
SPECIFICATION lfst_7_1__Spec
INVARIANT   lfst_7_1__TypeOK
INVARIANT   ncbk_2_2__strictly_increasing
INVARIANT   lfst_7_1_1__gap_free
INVARIANT   lfst_7_4_1__seq_counts_records
