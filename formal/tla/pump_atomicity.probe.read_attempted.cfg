\* PROBE, in the clause's engine: a callback tries a read on the engine that
\* called it, and is refused. The refusal path of [RARC.13.16], reached.
\* MUST VIOLATE: probe__no_read_attempted
CONSTANT rarc_13_16__ENGINE = "clause"
CONSTANT rarc_5_6_4__MAXF = 4
CONSTANT rarc_5_6_6__STEP = 1
SPECIFICATION rarc_13_16__Spec
INVARIANT   probe__no_read_attempted
