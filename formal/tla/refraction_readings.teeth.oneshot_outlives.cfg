\* TEETH, in an engine that gets a cell wrong: a time-dependent condition that
\* goes false leaves libds's one-shot as it was, so the one-shot outlives the
\* match and refuses the second opening -- once per wrapper, where [LTIM.2.5.1]
\* says once per edge. The libds column's cell on the stream whose window shuts
\* and reopens is then 1@2, not the clause's 1@2 1@6.
\* MUST VIOLATE: ldet_5_3__libds_fires_each_opening
CONSTANT ldet_5_3__ENGINE = "closing_keeps_fired"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_3__libds_fires_each_opening
