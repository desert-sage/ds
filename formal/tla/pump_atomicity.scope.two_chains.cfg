\* SCOPE: the clause's engine with two chains -- a fact f emits f + 2, so the odd
\* and the even facts cascade apart and a pump interleaves the two chains in the
\* order of their activations. The checks of pump_atomicity.cfg, under these
\* constants.
CONSTANT rarc_13_16__ENGINE = "clause"
CONSTANT rarc_5_6_4__MAXF = 4
CONSTANT rarc_5_6_6__STEP = 2
SPECIFICATION rarc_13_16__Spec
INVARIANT   rarc_13_16__TypeOK
PROPERTY    rarc_13_16__pump_refines_step
