\* TEETH, in an engine that gets a cell wrong: a release leaves the `fired`
\* flag as it was, so under the flag readings a token that was blocked and
\* released stays suppressed. A stream with a release in it ends on a sequence
\* that is not its cell of the table.
\* MUST VIOLATE: ldet_5_3__table_holds
CONSTANT ldet_5_3__ENGINE = "release_keeps_fired"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_3__table_holds
