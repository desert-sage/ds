\* TLC config for the [NDBG.22] multi-tier coordinated-pause spec.
\* A behavioral model: safety invariants plus two temporal properties, one of
\* which needs the fairness carried in ndbg_22_2_1__Spec.
\*
\* THREE TIERS, not two. With two, a single follower makes "the leader is
\* unaffected by a follower timeout" and "some follower settles" collapse into
\* the same trace. Three lets one follower time out while another pauses
\* normally, which is the interleaving [NDBG.22.3.1] actually describes.
\*
\* TIMEOUT = 2 is the smallest value that keeps a stall distinguishable from an
\* immediate timeout while leaving the state graph small.
\*
\* The engine is the clause's; the engines it rules out are the `.teeth.` configs.
CONSTANT ndbg_22_1_1__tier = {t1, t2, t3}
CONSTANT ndbg_22_3_2__TIMEOUT = 2
CONSTANT ndbg_22_2_1__ENGINE = "clause"
SPECIFICATION ndbg_22_2_1__Spec
INVARIANT   ndbg_22_2_2__TypeOK
INVARIANT   ndbg_22_1_2__at_most_one_leader
INVARIANT   ndbg_22_2_3__skew_bounded
INVARIANT   ndbg_22_3_1__leader_unaffected
PROPERTY    ndbg_22_3_1__every_follower_settles
