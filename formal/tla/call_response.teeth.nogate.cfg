\* TEETH, in an engine the clause rules out: the cooldown gate admits every
\* firing. A cooled call fires and fires again inside its window: a second
\* request is issued, where the clause has the call suppressed. (The admitted
\* firing sweeps as well, so `suppressed_retracts_nothing` falls with it; this
\* config names the request.)
\* MUST VIOLATE: lcrs_8_2__suppressed_not_issued
CONSTANT lcrs_3_3__call = { c1, c2 }
CONSTANT lcrs_4_3_2__TTL = 2
CONSTANT lcrs_4_2_1__ERROR_TTL = 3
CONSTANT lcrs_6_2_4__FIRES = 2
CONSTANT lcco_3_4__GENERATED = { c2 }
CONSTANT lcrs_8_1__COOLED = { c1 }
CONSTANT lcrs_8_2__WINDOW = 1
CONSTANT lcrs_8_2__DENIALS = 1
CONSTANT lcrs_6_1__ENGINE = "nogate"
SPECIFICATION lcrs_6_1__Spec
PROPERTY    lcrs_8_2__suppressed_not_issued
