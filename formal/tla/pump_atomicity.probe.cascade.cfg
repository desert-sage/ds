\* PROBE, in the clause's engine: a pump fires more than once -- a cascade, or
\* two inputs before one pump -- so the event sequence the refinement compares
\* has an order to get wrong.
\* MUST VIOLATE: probe__one_firing_per_pump
CONSTANT rarc_13_16__ENGINE = "clause"
CONSTANT rarc_5_6_4__MAXF = 4
CONSTANT rarc_5_6_6__STEP = 1
SPECIFICATION rarc_13_16__Spec
INVARIANT   probe__one_firing_per_pump
