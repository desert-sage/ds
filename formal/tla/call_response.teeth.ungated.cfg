\* TEETH, in an engine the clause rules out: the sweep is compiled ahead of the
\* cooldown gate, so the gate does not cover it. A cooled call fires, is
\* answered, and fires again inside its window: the gate denies the call, and
\* the live answer is retracted anyway, where the clause has a suppressed call
\* retract nothing.
\* MUST VIOLATE: lcrs_6_2_1__suppressed_retracts_nothing
CONSTANT lcrs_3_3__call = { c1, c2 }
CONSTANT lcrs_4_3_2__TTL = 2
