\* TEETH, in an engine the clause rules out: one TTL for both kinds. A
\* `CallError` is swept at the response schema's TTL, below its own 5_min in
\* this ordering (call_response.cfg's); call_response.teeth.one_ttl_long.cfg
\* runs the other, where the same engine keeps it past 5_min.
\* MUST VIOLATE: lcrs_6_6_1__not_before_its_ttl
