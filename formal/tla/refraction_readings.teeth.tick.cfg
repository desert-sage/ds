\* TEETH, in an engine that gets a cell wrong: under "anywm" a tick clears
\* every flag, so a time-dependent rule fires at every tick its condition
\* holds. A timed stream ends on a sequence that is not its cell of the table.
\* MUST VIOLATE: ldet_5_3__table_holds
CONSTANT ldet_5_3__ENGINE = "tick_clears"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_3__table_holds
