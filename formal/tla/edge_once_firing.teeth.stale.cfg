\* TEETH for [LTIM.2.4.1] and [LTIM.2.4.3]. The engine that fires at the pump
\* what was true at the assert, without re-evaluating it under the pump's own
\* sample: a fact minted with its condition true, a pump that begins with it
\* false, and the firing all the same. It is the reading [LTIM.2.5.3]
\* refuses: "a condition the pump's sample finds false has ended its match,
\* and nothing fires".
\* MUST VIOLATE: ltim_2_4_1__shut_means_silent
CONSTANT ltim_2_4_2__MAXPUMP = 4
CONSTANT ltim_2_5_2__MAXWRAPPER = 2
CONSTANT ltim_2_5_1__READING = "stale"
CONSTANT iret_11_5__LIMITED = FALSE
SPECIFICATION ltim_2_5__Spec
PROPERTY    ltim_2_4_1__shut_means_silent
