\* TEETH for [LSIG.2.2.4], one convention for samples and edges. The engine
\* applies `[t - W, t]` to an edge's instant and `(t - W, t]` to a sample: an
\* edge exactly W old is counted while the sample it is the instant of is not
\* seen, so the edge count and the window no longer compose over one bound.
\* MUST VIOLATE: lsig_2_2_4__edges_share_the_sample_window
CONSTANT lser_14_1__MODEL = "sliding"
CONSTANT lser_14_1__W = 2
CONSTANT lsmp_2_1__N = 2
CONSTANT ltim_2_8_2__MAXCLOCK = 5
CONSTANT lser_14_1__MAXABSORB = 3
CONSTANT lsig_2_2_4__LEFT = "open"
CONSTANT lsig_2_2_4__EDGE_LEFT = "closed"
CONSTANT lsig_2_5_1__READ = "discounts"
CONSTANT lsig_2_5_1__EVICT = "window"
CONSTANT lsig_1_4_1__BEFORE = "nothing"
CONSTANT lser_19_8__COLD = "empty"
CONSTANT lsig_1_4_2__DENOM = "min"
SPECIFICATION lser_14_1__Spec
INVARIANT   lsig_2_2_4__edges_share_the_sample_window
