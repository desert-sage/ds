\* TEETH, in an engine that gets a cell wrong: a release mints a new timetag
\* for every live token, in key order, so two tokens released together fire
\* in key order whatever order their matches completed in. The stream that
\* mints key 2 before key 1 and releases both ends on a sequence that is not
\* its cell of the table.
\* MUST VIOLATE: ldet_5_3__table_holds
CONSTANT ldet_5_3__ENGINE = "release_remints"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_3__table_holds
