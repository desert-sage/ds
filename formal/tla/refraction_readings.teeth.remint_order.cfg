\* TEETH, in an engine that gets the clause's order wrong: a release mints a
\* new timetag for every live token, in key order, and the drain orders by the
\* minted timetags. On the stream that mints key 2 before key 1 and releases
\* both, key 1 fires first, which is not the order their matches first
\* completed in: the history `ldet_5_9__completedAt` shows it where the live
\* stamps could not.
\* MUST VIOLATE: ldet_5_9__released_fires_in_stamp_order
CONSTANT ldet_5_3__ENGINE = "release_remints"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_9__released_fires_in_stamp_order
