\* PROBE for [LSER.19.8]: the clause's engine, against a property that says a
\* windowed read is cold exactly when a step aggregation's would be. TLC must
\* return the behaviour that parts them: a silence of W empties the window and
\* the read is cold while the instance has absorbed, the case the clause
\* carves out for `active_fraction` and `integral`.
\* MUST VIOLATE: probe__the_two_colds_agree
CONSTANT lser_14_1__MODEL = "sliding"
CONSTANT lser_14_1__W = 2
CONSTANT lsmp_2_1__N = 2
CONSTANT ltim_2_8_2__MAXCLOCK = 5
CONSTANT lser_14_1__MAXABSORB = 3
CONSTANT lsig_2_2_4__LEFT = "open"
CONSTANT lsig_2_2_4__EDGE_LEFT = "open"
CONSTANT lsig_2_5_1__READ = "discounts"
CONSTANT lsig_2_5_1__EVICT = "window"
CONSTANT lsig_1_4_1__BEFORE = "nothing"
CONSTANT lser_19_8__COLD = "empty"
CONSTANT lsig_1_4_2__DENOM = "min"
SPECIFICATION lser_14_1__Spec
INVARIANT   probe__the_two_colds_agree
