\* TLC config for the refraction readings.
\*
\* One constant, the engine: the reading, the identity and the stream are
\* chosen in Init, so one run walks every cell of the table. The table
\* invariant is vacuous until a stream is consumed and decisive at its end; the
\* stamp-order invariant is checked at every state. The engine is the one the
\* table was worked from; the six that get a cell wrong are the `.teeth.`
\* configs.
CONSTANT ldet_5_3__ENGINE = "clause"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_3__TypeOK
INVARIANT   ldet_5_3__table_holds
INVARIANT   ldet_5_3__libds_fires_each_opening
INVARIANT   ldet_5_9__released_fires_in_stamp_order
