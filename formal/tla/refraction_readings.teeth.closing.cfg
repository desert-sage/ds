\* TEETH, in an engine that gets a cell wrong: a time-dependent condition that
\* goes false leaves the `fired` flag as it was, so under the flag readings a
\* gate that shuts and opens again stays suppressed. The stream whose window
\* shuts and reopens ends on a sequence that is not its cell of the table.
\* MUST VIOLATE: ldet_5_3__table_holds
CONSTANT ldet_5_3__ENGINE = "closing_keeps_fired"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_3__table_holds
