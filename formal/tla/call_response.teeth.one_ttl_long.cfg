\* TEETH, in an engine the clause rules out: one TTL for both kinds, under the
\* other ordering of the two durations. A response schema declares its own TTL
\* ([LCRS.4.3.2]); here it is the longer, so a `CallError` swept at it is kept
\* past its own 5_min. call_response.teeth.one_ttl.cfg runs the ordering of
\* call_response.cfg, where the same engine sweeps the `CallError` early; the
\* clause's engine under this ordering is call_response.scope.long.cfg's run.
\* MUST VIOLATE: lcrs_6_6_1__never_past_its_ttl
CONSTANT lcrs_3_3__call = { c1, c2 }
CONSTANT lcrs_4_3_2__TTL = 3
CONSTANT lcrs_4_2_1__ERROR_TTL = 2
CONSTANT lcrs_6_2_4__FIRES = 2
CONSTANT lcco_3_4__GENERATED = { c2 }
CONSTANT lcrs_8_1__COOLED = { c1 }
CONSTANT lcrs_8_2__WINDOW = 1
CONSTANT lcrs_8_2__DENIALS = 1
CONSTANT lcrs_6_1__ENGINE = "one_ttl"
SPECIFICATION lcrs_6_1__Spec
INVARIANT   lcrs_6_6_1__never_past_its_ttl
