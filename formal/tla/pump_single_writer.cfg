\* TLC config for the [NLFC.2.2] / [NLFC.3.3] pump single-writer + drain spec.
\* Extends formal/tla/determinism's drain with the writer-exclusion interleaving.
\* SPECIFICATION carries weak fairness on firing/return so the drain-to-return
\* liveness is checked alongside the exclusion + returns-when-drained safety.
\* The engine is the clause's; the engines it rules out are the `.teeth.` configs.
CONSTANT nlfc_2_2__CAP = 2
CONSTANT nlfc_2_2__SPAWN = 1
CONSTANT nlfc_2_2__ENGINE = "clause"
SPECIFICATION nlfc_2_2__Spec
INVARIANT   nlfc_2_2__TypeOK
INVARIANT   nlfc_3_3__single_writer
PROPERTY    nlfc_2_2__return_only_when_drained
PROPERTY    nlfc_2_2__pump_drains
