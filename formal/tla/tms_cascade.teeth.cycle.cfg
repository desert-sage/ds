\* TEETH, on the graph [LCYC.3.1.1] rules out: the clause's own count engine
\* over the unfounded cycle P -> Q, Q -> R, R -> Q. Retract P and the count
\* keeps Q and R, each the other's justification, with nothing founding
\* either -- [IRET.12.2]'s "on a support cycle it keeps every member's count
\* above zero with no well-founded justification left", seen. Two states.
\* MUST VIOLATE: iret_12_2__quiescent_is_well_founded
CONSTANT iret_12__ENGINE = "clause"
CONSTANT iret_12__GRAPH = "cycle"
SPECIFICATION iret_12__Spec
INVARIANT   iret_12_2__quiescent_is_well_founded
