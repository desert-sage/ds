\* TEETH, in an engine that gets a cell wrong: the generation advances at a
\* boundary and at no working-memory change, so under "pump_oneshot" a token
\* blocked and released within one pump is still in scope. A stream with a
\* block and a release in one pump ends on a sequence that is not its cell of
\* the table.
\* MUST VIOLATE: ldet_5_3__table_holds
CONSTANT ldet_5_3__ENGINE = "gen_stuck"
SPECIFICATION ldet_5_3__Spec
INVARIANT   ldet_5_3__table_holds
