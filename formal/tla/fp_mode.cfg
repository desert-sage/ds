\* TLC config for the [LDET.3.6.1] floating-point mode spec.
\* Three modes (the engine's and two others), two engines, nesting to depth 6:
\* integrator -> engine -> callback -> the other engine -> callback -> ...
\* What the bound excludes: a third engine and deeper nesting, which repeat the
\* same frames.
CONSTANT ldet_3_6_1__MODES = {"rne", "rz", "ru"}
CONSTANT ldet_3_6_1__RNE = "rne"
CONSTANT ldet_3_6_1__ENGINES = {"e1", "e2"}
CONSTANT ldet_3_6_1__DEPTH = 6
SPECIFICATION ldet_3_6_1__Spec
INVARIANT   ldet_3_6_1__TypeOK
INVARIANT   ldet_3_6_1__engine_runs_rne
INVARIANT   ldet_3_6_1__integrator_sees_own
INVARIANT   ndet_1_3__outer_untouched
