\* TLC config for the series window spec ([LSER.14.1]), in the clause's engine
\* under `sliding`: the half-open window applied to samples and to edges alike,
\* a query that discounts as of the clock, eviction by the absorption's own
\* window, nothing held before the first absorption, a read cold when it sees
\* nothing, the denominator min(W, elapsed). A SAFETY model. W = 2 over a clock
\* of 0..5 and three absorptions: enough for a sample to be exactly W old at a
\* read, for a silence to empty the window, for a `false`, a `true` and a
\* `true` again, and for a bag of 2 to be past its size. The other value of
\* each constant is a `.teeth.` config; the other two time models are the
\* `.scope.` configs.
CONSTANT lser_14_1__MODEL = "sliding"
CONSTANT lser_14_1__W = 2
CONSTANT lsmp_2_1__N = 2
CONSTANT ltim_2_8_2__MAXCLOCK = 5
CONSTANT lser_14_1__MAXABSORB = 3
CONSTANT lsig_2_2_4__LEFT = "open"
CONSTANT lsig_2_2_4__EDGE_LEFT = "open"
CONSTANT lsig_2_5_1__READ = "discounts"
CONSTANT lsig_2_5_1__EVICT = "window"
CONSTANT lsig_1_4_1__BEFORE = "nothing"
CONSTANT lser_19_8__COLD = "empty"
CONSTANT lsig_1_4_2__DENOM = "min"
SPECIFICATION lser_14_1__Spec
INVARIANT   lser_14_1__TypeOK
INVARIANT   lser_14_1__read_sees_the_window
INVARIANT   lsig_2_5_1__eviction_keeps_the_window
INVARIANT   lser_19_8__cold_iff_empty
INVARIANT   lsig_1_4_1__edges_are_transitions
INVARIANT   lsig_2_2_4__edges_share_the_sample_window
INVARIANT   lsig_1_4_2__denominator_is_elapsed_before_W
