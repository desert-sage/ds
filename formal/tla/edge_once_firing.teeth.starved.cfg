\* TEETH for [LTIM.2.4.2], "must therefore fire once the clock advances to
\* satisfy it". The clause's engine with a pump that may stop before
\* quiescence: the pump ends with the edge's activation unfired, and the match
\* is gone before any pump fires it -- the condition false at the next pump,
\* or the fact replaced or retracted between the two. The edge never fires.
\* TLC returns one such behaviour, and not the shortest.
\* MUST VIOLATE: ltim_2_4_2__edge_fires
CONSTANT ltim_2_4_2__MAXPUMP = 4
CONSTANT ltim_2_5_2__MAXWRAPPER = 2
CONSTANT ltim_2_5_1__READING = "match"
CONSTANT iret_11_5__LIMITED = TRUE
SPECIFICATION ltim_2_5__Spec
PROPERTY    ltim_2_4_2__edge_fires
