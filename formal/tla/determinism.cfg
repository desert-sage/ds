\* TLC config for the [LDET.5.1] / [LDET.2.4.10] determinism spec.
\* Every input trace of length <= 4 over {A, B, P}; two copies in lockstep. The
\* SPECIFICATION carries weak fairness on the engine actions, so TLC checks the run
\* consumes and drains (liveness) alongside unique-next and same-trace (safety).
\* The engine is the clause's; the engines it rules out are the `.teeth.` configs.
CONSTANT ldet_2_4_10__MAXLEN = 4
CONSTANT ldet_5_1__ENGINE = "clause"
SPECIFICATION ldet_5_1__Spec
INVARIANT   ldet_5_1__TypeOK
INVARIANT   ldet_5_1__unique_next
INVARIANT   ldet_2_4_10__same_trace
PROPERTY    ldet_5_1__drains
