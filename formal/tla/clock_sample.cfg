\* TLC config for the [LTIM.2.8] two-clock sampling spec, in the clause's engine:
\* one sample per step, both clocks observed and carried, the first sample
\* always recorded, a step's ClockAdvance written before its inject atom, and
\* the relative-time mechanisms on the monotonic clock. A SAFETY model. Three
\* steps and two reads each let the platform move between two reads of one
\* step and between two steps; a wall range of two values is enough for the
\* wall clock to go back. The other value of each constant is a `.teeth.`
\* config.
CONSTANT ltim_2_8_4__MAXSTEP = 3
CONSTANT ltim_2_8_4__MAXREAD = 2
CONSTANT ltim_2_8_2__MAXMONO = 2
CONSTANT ltim_2_8_3__MAXWALL = 1
CONSTANT ltim_2_8_4__SAMPLING = "step"
CONSTANT ltim_2_8_5__FIRST = "always"
CONSTANT ltim_2_8_5__WHAT = "both"
CONSTANT rfcs_10_5__ORDER = "before"
CONSTANT ltim_2_8_2__RELATIVE = "mono"
SPECIFICATION ltim_2_8_4__Spec
INVARIANT   ltim_2_8_4__TypeOK
INVARIANT   ltim_2_8_4__one_value_per_step
INVARIANT   ltim_2_8_5__replay_holds_what_was_held
PROPERTY    ltim_2_8_2__mono_never_decreases
