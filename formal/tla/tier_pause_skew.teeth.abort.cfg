\* TEETH, in an engine the clause rules out: a follower's timeout resets the
\* leader too. A follower times out, and the tier that holds the pause is
\* running.
\* MUST VIOLATE: ndbg_22_3_1__leader_unaffected
CONSTANT ndbg_22_1_1__tier = {t1, t2, t3}
CONSTANT ndbg_22_3_2__TIMEOUT = 2
CONSTANT ndbg_22_2_1__ENGINE = "aborts_group"
SPECIFICATION ndbg_22_2_1__Spec
INVARIANT   ndbg_22_3_1__leader_unaffected
