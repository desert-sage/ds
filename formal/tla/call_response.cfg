\* TLC config for the [LCRS.6] async call/response answer-lifetime spec.
\* A LIVENESS model: the SPECIFICATION carries weak fairness on the tick, so
\* TLC checks eventual retraction against fair runs. `CallError`'s TTL (5_min)
\* is set above the response schema's here; call_response.scope.long.cfg runs
\* the same checks with the response schema's the longer, since a schema may
\* declare either ([LCRS.4.3.2]), and the `one_ttl` and `one_ttl_long` teeth
\* engines get one ordering wrong each. FIRES = 2 is
\* [LCRS.6.2.4]'s case: a call fires, and fires again before it is answered.
\* GENERATED = { c2 } gives one call the engine's correlation, one value per
\* firing ([LCCO.3.4]), beside c1's author-written one, so the sweep that
\* finds nothing and the answers that accumulate run beside the sweep that
\* retracts. COOLED = { c1 } puts the cooldown gate on the author-correlated
\* call, where a denied firing has an answer to leave live; WINDOW = 1 is the
\* smallest window a tick can elapse; DENIALS = 1 bounds the denials, one being
\* what the properties and probes need.
CONSTANT lcrs_3_3__call = { c1, c2 }
CONSTANT lcrs_4_3_2__TTL = 2
CONSTANT lcrs_4_2_1__ERROR_TTL = 3
CONSTANT lcrs_6_2_4__FIRES = 2
CONSTANT lcco_3_4__GENERATED = { c2 }
CONSTANT lcrs_8_1__COOLED = { c1 }
CONSTANT lcrs_8_2__WINDOW = 1
CONSTANT lcrs_8_2__DENIALS = 1
CONSTANT lcrs_6_1__ENGINE = "clause"
SPECIFICATION lcrs_6_1__Spec
INVARIANT   lcrs_6_1__TypeOK
INVARIANT   lcrs_4_2_2__one_kind_when_live
INVARIANT   lcrs_6_2_4__one_answer_per_corr
INVARIANT   lcrs_6_6_1__never_past_its_ttl
PROPERTY    lcrs_6_2_1__issued_call_sweeps
PROPERTY    lrst_1_2__generated_supersedes_nothing
PROPERTY    lcrs_6_2_1__suppressed_retracts_nothing
PROPERTY    lcrs_8_2__suppressed_not_issued
PROPERTY    lcrs_6_6_1__not_before_its_ttl
PROPERTY    lcrs_6_6_1__no_orphan_forever
