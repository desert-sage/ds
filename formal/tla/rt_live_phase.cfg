\* TLC config for the [NRTM.5] RT INIT->LIVE phase-gate spec.
\* Behavioral (over-time) sibling of formal/alloy/rt_lifecycle.als. A SAFETY model:
\* invariants + temporal properties over reachable states, no fairness needed.
\* The engine is the clause's; the engines it rules out are the `.teeth.` configs.
CONSTANT nrtm_5_3__MAXGEN = 2
CONSTANT nrtm_5_1__ENGINE = "clause"
SPECIFICATION nrtm_5_1__Spec
INVARIANT   nrtm_5_1__TypeOK
INVARIANT   nrtm_5_2__live_implies_preconds
PROPERTY    nrtm_5_2__live_is_terminal
PROPERTY    nrtm_5_3__live_is_frozen
